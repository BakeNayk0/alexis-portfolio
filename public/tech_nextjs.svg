<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <style>
      /* Make outer circle follow theme color */
      .nextjs-outer { fill: currentColor; }
      /* Make inner N elements white in dark mode, black in light mode */
